[project]
name = "fpl-bot"
version = "0.1.0"
description = "Telegram bot for tracking Fantasy Premier League mini-leagues live"
requires-python = ">=3.12"
dependencies = [
    "aiogram>=3.15,<4",
    "httpx[http2]>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "apscheduler>=3.11,<4",
    "orjson>=3.10",
    "structlog>=24.4",
    "tenacity>=9.0",
    "python-dotenv>=1.0",
    "uvloop>=0.21; sys_platform != 'win32'",
    "aiohttp>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.8", "mypy>=1.13"]

[project.scripts]
fplbot = "fplbot.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fplbot"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: hits the real FPL API; needs --run-integration"]
addopts = "-m 'not integration'"
